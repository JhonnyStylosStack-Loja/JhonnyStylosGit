<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#ffffff">
  <!-- Keep the canvas light before external stylesheets load. -->
  <style>
    html { color-scheme: light; color-scheme: only light; background: #ffffff; color: #2d2226; }
    body { background-color: #ffffff; }
  </style>
  <title>Definir senha | Jhonny Stylos</title>
  <link rel="icon" type="image/webp" href="assets/images/logotipo/ICONE CIRCULAR.webp">
  <link rel="stylesheet" href="css/reset.css?v=20261024-9">
  <link rel="stylesheet" href="css/variables.css?v=20261026-light-1">
  <link rel="stylesheet" href="css/global.css?v=20261026-light-1">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:#fff;padding:24px}
    .password-card{width:min(100%,460px);background:#fff;border:1px solid #ffd0d3;border-radius:18px;padding:32px;box-shadow:0 12px 40px rgba(45,34,38,.08)}
    .password-logo{display:block;width:220px;max-width:80%;height:auto;margin:0 auto 24px}.password-card h1{margin:0 0 12px}.password-card p{color:#6b5a5f;line-height:1.55}
    .password-field{display:grid;gap:8px;margin:20px 0}.password-field input{padding:13px;border:1px solid #d8c8cc;border-radius:8px;font:inherit}
    .password-button{width:100%;border:0;border-radius:8px;padding:14px;background:#9b3b48;color:#fff;font-weight:700;cursor:pointer}
    .password-button:disabled{opacity:.6;cursor:wait}.password-message{min-height:24px;margin-top:16px;font-size:14px}.password-message.error{color:#b42318}.password-message.success{color:#067647}
  </style>
</head>
<body>
  <main class="password-card">
    <img class="password-logo" src="assets/images/logotipo/LOGO-MENU.webp" alt="Jhonny Stylos — Moda Feminina">
    <h1>Defina sua senha</h1>
    <p>Crie uma senha com pelo menos 8 caracteres para concluir seu convite ou recuperação de acesso.</p>
    <form id="set-password-form">
      <label class="password-field">Nova senha<input id="new-password" type="password" minlength="8" autocomplete="new-password" required></label>
      <label class="password-field">Confirmar senha<input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required></label>
      <button class="password-button" type="submit">Salvar senha</button>
      <p class="password-message" id="password-message" role="status"></p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/supabase.js?v=20261024-9"></script>
  <script src="js/auth/supabaseAuth.js?v=20261024-9"></script>
  <script src="js/pages/set-password.js?v=20261024-9"></script>
</body>
</html>
