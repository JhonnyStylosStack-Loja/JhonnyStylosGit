<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0;url=login.html#recuperar-senha">
  <meta name="color-scheme" content="light only">
  <title>Recuperar senha — Jhonny Stylos</title>
  <link rel="icon" type="image/webp" href="assets/images/logotipo/ICONE CIRCULAR.webp">
  <link rel="stylesheet" href="css/reset.css?v=20261024-9">
  <link rel="stylesheet" href="css/variables.css?v=20261024-9">
  <link rel="stylesheet" href="css/global.css?v=20261024-9">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#fff 0%,#f8f8f8 100%);padding:24px}
    .recovery-card{width:min(100%,460px);background:#fff;border:1px solid #ffd0d3;border-radius:18px;padding:32px;box-shadow:0 12px 40px rgba(45,34,38,.08)}
    .recovery-logo{display:block;width:220px;max-width:80%;height:auto;margin:0 auto 24px}
    .recovery-card h1{margin:0 0 10px;color:#2d2226}.recovery-card>p{margin:0 0 24px;color:#6b5a5f;line-height:1.6}
    .recovery-field{display:grid;gap:8px;margin-bottom:18px;color:#2d2226;font-size:14px;font-weight:600}.recovery-field input{padding:13px;border:1px solid #ffd0d3;border-radius:8px;font:inherit;font-weight:400}.recovery-field input:focus{outline:none;border-color:#ffbdc6;box-shadow:0 0 0 3px rgba(255,189,198,.35)}
    .recovery-button{width:100%;border:0;border-radius:8px;padding:14px;background:#ffbdc6;color:#2d2226;font-weight:700;cursor:pointer}.recovery-button:disabled{opacity:.6;cursor:wait}
    .recovery-message{min-height:24px;margin:16px 0 0;font-size:14px;line-height:1.5}.recovery-message.error{color:#b42318}.recovery-message.success{color:#067647}
    .recovery-back{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;text-align:center;color:#9b3b48;font-size:14px;font-weight:600;text-decoration:none}.recovery-back svg{width:16px;height:16px}.recovery-back:hover{text-decoration:underline}
  </style>
</head>
<body onload="location.replace('login.html#recuperar-senha')">
  <main class="recovery-card">
    <img class="recovery-logo" src="assets/images/logotipo/LOGO-MENU.webp" alt="Jhonny Stylos — Moda Feminina">
    <h1>Recuperar senha</h1>
    <p>Informe o e-mail da sua conta. Enviaremos um link seguro para você criar uma nova senha.</p>
    <form id="forgot-password-form" novalidate>
      <label class="recovery-field">E-mail
        <input id="recovery-email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>
      </label>
      <button class="recovery-button" type="submit">Enviar link de recuperação</button>
      <p class="recovery-message" id="recovery-message" role="status" aria-live="polite"></p>
    </form>
    <a class="recovery-back" href="login.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Voltar para o login</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/supabase.js?v=20261024-9"></script>
  <script src="js/auth/supabaseAuth.js?v=20261024-9"></script>
  <script src="js/pages/forgot-password.js?v=20261024-9"></script>
</body>
</html>
